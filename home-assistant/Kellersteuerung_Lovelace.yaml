              action: "more-info"
            icon_tap_action:
              action: "none"
      - type: "grid"
        cards:
          - type: "heading"
            heading: "Laufzeiten und Pausen"
            icon: "mdi:timer-outline"
          - type: "tile"
            entity: "sensor.keller_heizkreis_laufzeit_heute"
            name: "Aktivzeit heute (h)"
          - type: "tile"
            entity: "sensor.keller_heizkreis_pause_heute"
            name: "Pause heute (h)"
          - type: "tile"
            entity: "sensor.keller_heizkreis_laufzeit_durchschnitt"
            name: "Ø Aktivphase (min)"
          - type: "tile"
            entity: "sensor.keller_heizkreis_pause_durchschnitt"
            name: "Ø Pause (min)"
          - type: "tile"
            entity: "input_number.keller_heizkreis_laufzeit_letzte"
            name: "Letzte Aktivphase"
          - type: "tile"
            entity: "input_number.keller_heizkreis_pause_letzte"
            name: "Letzte Pause"
          - type: "tile"
            entity: "input_number.keller_heizkreis_laufzeit_min"
            name: "Kürzeste Aktivphase"
          - type: "tile"
            entity: "input_number.keller_heizkreis_laufzeit_max"
            name: "Längste Aktivphase"
          - type: "tile"
            entity: "input_number.keller_heizkreis_pause_min"
            name: "Kürzeste Pause"
          - type: "tile"
            entity: "input_number.keller_heizkreis_pause_max"
            name: "Längste Pause"
      - type: "grid"
        cards:
          - type: "heading"
            heading: "Trend & Interpretation"
            icon: "mdi:chart-box-outline"
          - type: "history-graph"
            title: "Aktiv / Pause · 24 Stunden"
            hours_to_show: 24
            entities:
              - "binary_sensor.keller_heizkreis_aktiv"
          - type: "history-graph"
            title: "Spreizung · 6 Stunden"
            hours_to_show: 6
            entities:
              - "sensor.keller_heizkreis_spreizung"
          - type: "markdown"
            content: "**Hinweis:** Die Zyklen werden anhand der Temperaturspreizung geschätzt; es handelt sich **nicht** um echte Brennerstarts. Vorhandene alte Ausreißer werden durch dieses Dashboard nicht gelöscht."
  - title: "Temperaturen"
