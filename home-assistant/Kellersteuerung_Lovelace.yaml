            days_to_show: 14
            period: "day"
          - type: "statistics-graph"
            title: "Bestand · 30 Tage"
            entities:
              - "sensor.keller_tank_gesamt_5min"
            chart_type: "line"
            stat_types:
              - "mean"
            days_to_show: 30
            period: "day"
      - type: "grid"
        cards:
          - type: "heading"
            heading: "Warnungen"
            icon: "mdi:shield-check-outline"
