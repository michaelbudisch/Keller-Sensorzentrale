              - "sensor.heizungskeller_sensoren_slot_5"
              - "sensor.heizungskeller_sensoren_slot_6"
      - type: "grid"
        cards:
          - type: "heading"
            heading: "Langzeitverlauf"
            icon: "mdi:chart-line"
