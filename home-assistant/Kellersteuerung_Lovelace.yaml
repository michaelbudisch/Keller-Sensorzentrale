            entity: "binary_sensor.heizungskeller_sensoren_fullstand_niedrig"
            name: "Füllstand niedrig"
          - type: "tile"
            entity: "binary_sensor.heizungskeller_sensoren_sensorstorung"
            name: "Sensorfehler"
          - type: "markdown"
            content: "**Messung:** Der zweite Tank wird nicht einzeln gemessen. Das Gesamtvolumen ist eine Hochrechnung. Die mechanischen Tankuhren sollten weiterhin kontrolliert werden. Referenz der aktuellen Prozentrechnung: **720 L je Tank**."
