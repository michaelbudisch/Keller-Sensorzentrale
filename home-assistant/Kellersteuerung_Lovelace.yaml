# Kellersteuerung – native Lovelace-Sections (HA, keine custom cards)
title: "Kellersteuerung"
views:
  - title: "Übersicht"
    path: "uebersicht"
    icon: "mdi:view-dashboard"
    type: "sections"
    max_columns: 3
    sections:
      - type: "grid"
        cards:
          - type: "heading"
            heading: "Heizkreis · Aktuell"
            icon: "mdi:radiator"
          - type: "tile"
            entity: "sensor.heizungskeller_sensoren_slot_1"
            name: "Vorlauf"
          - type: "tile"
            entity: "sensor.heizungskeller_sensoren_slot_2"
            name: "Rücklauf"
          - type: "tile"
            entity: "sensor.keller_heizkreis_spreizung"
            name: "Spreizung"
          - type: "history-graph"
            title: "Letzte 6 Stunden · Vorlauf und Rücklauf"
            hours_to_show: 6
            entities:
              - "sensor.heizungskeller_sensoren_slot_1"
              - "sensor.heizungskeller_sensoren_slot_2"
          - type: "markdown"
            content: "Tagesauswahl und Langzeitstatistiken stehen im Reiter **Heizkreis**."
      - type: "grid"
        cards:
          - type: "heading"
            heading: "Heizöl · Bestand"
            icon: "mdi:barrel"
          - type: "gauge"
            entity: "sensor.keller_tank_fuellstand_5min"
            name: "Tankfüllstand"
            min: 0
            max: 100
            segments:
              - from: 0
                color: "red"
              - from: 15
                color: "amber"
              - from: 35
                color: "teal"
          - type: "tile"
            entity: "sensor.keller_tank_gesamt_5min"
            name: "Gesamtbestand · geschätzt"
          - type: "tile"
            entity: "sensor.keller_tank_einzeln_5min"
            name: "Gemessener Tank"
          - type: "tile"
            entity: "sensor.heizoel_verbrauch_heute"
            name: "Verbrauch heute"
          - type: "markdown"
            content: "Tages-/Monatsverläufe stehen im Reiter **Öltank**."
      - type: "grid"
        cards:
          - type: "heading"
            heading: "Steuerung & Verbindung"
            icon: "mdi:server-network"
          - type: "tile"
            entity: "switch.heizungskeller_sensoren_relais_1"
            name: "Relais 1 · Details"
            tap_action:
              action: "more-info"
            icon_tap_action:
              action: "none"
          - type: "tile"
            entity: "switch.heizungskeller_sensoren_relais_2"
            name: "Relais 2 · Details"
            tap_action:
              action: "more-info"
            icon_tap_action:
              action: "none"
          - type: "tile"
            entity: "sensor.keller_heizkreis_starts_heute"
            name: "Heizzyklen heute"
          - type: "tile"
            entity: "binary_sensor.keller_heizkreis_aktiv"
            name: "Erkannte Aktivphase"
          - type: "tile"
            entity: "sensor.heizungskeller_sensoren_wlan_signal"
            name: "WLAN-Signal"
          - type: "markdown"
            content: "Relais werden absichtlich **nicht direkt** per Symbolklick geschaltet. Weitere Werte unter **System**."
  - title: "Heizkreis"
    path: "heizkreis"
    icon: "mdi:radiator"
    type: "sections"
    max_columns: 3
    sections:
      - type: "grid"
        cards:
          - type: "heading"
            heading: "Live-Temperaturen"
            icon: "mdi:thermometer"
          - type: "tile"
            entity: "sensor.heizungskeller_sensoren_slot_1"
            name: "Vorlauf"
          - type: "tile"
            entity: "sensor.heizungskeller_sensoren_slot_2"
            name: "Rücklauf"
          - type: "tile"
            entity: "sensor.keller_heizkreis_spreizung"
            name: "Spreizung"
          - type: "history-graph"
            title: "Letzte 6 Stunden · Temperaturen"
            hours_to_show: 6
            entities:
              - "sensor.heizungskeller_sensoren_slot_1"
              - "sensor.heizungskeller_sensoren_slot_2"
          - type: "history-graph"
            title: "Letzte 6 Stunden · Spreizung"
            hours_to_show: 6
            entities:
              - "sensor.keller_heizkreis_spreizung"
      - type: "grid"
        cards:
          - type: "heading"
            heading: "Datumsauswahl · Temperaturverlauf"
            icon: "mdi:calendar-range"
          - type: "markdown"
            content: "**Tag auswählen:** Der native Datumswähler steuert die beiden Statistikgrafiken darunter. Einzeltage und Zeiträume können frei gewählt werden. Für Rohmesspunkte ist zusätzlich die HA-Historie erreichbar."
          - type: "energy-date-selection"
            collection_key: "energy_keller_heizkreis"
            disable_compare: true
          - type: "statistics-graph"
            title: "Ausgewählter Zeitraum · Vorlauf und Rücklauf"
            entities:
              - "sensor.heizungskeller_sensoren_slot_1"
              - "sensor.heizungskeller_sensoren_slot_2"
            chart_type: "line"
            stat_types:
              - "mean"
            energy_date_selection: true
            collection_key: "energy_keller_heizkreis"
          - type: "statistics-graph"
            title: "Ausgewählter Zeitraum · Spreizung"
            entities:
              - "sensor.keller_heizkreis_spreizung"
            chart_type: "line"
            stat_types:
              - "mean"
            energy_date_selection: true
            collection_key: "energy_keller_heizkreis"
          - type: "button"
            name: "Exakte Messpunkte in der Home-Assistant-Historie"
            icon: "mdi:history"
            tap_action:
              action: "navigate"
              navigation_path: "/history"
      - type: "grid"
        cards:
          - type: "heading"
            heading: "24-Stunden-Statistik"
            icon: "mdi:chart-bell-curve"
          - type: "tile"
            entity: "sensor.heizkreis_vorlauf_mittel_24h"
            name: "Ø Vorlauf"
          - type: "tile"
            entity: "sensor.heizkreis_rucklauf_mittel_24h"
            name: "Ø Rücklauf"
          - type: "tile"
            entity: "sensor.heizkreis_spreizung_mittel_24h"
            name: "Ø Spreizung"
          - type: "tile"
            entity: "sensor.heizkreis_vorlauf_maximum_24h"
            name: "Max. Vorlauf"
          - type: "tile"
            entity: "sensor.heizkreis_rucklauf_minimum_24h"
            name: "Min. Rücklauf"
          - type: "tile"
            entity: "sensor.heizkreis_spreizung_maximum_24h"
            name: "Max. Spreizung"
          - type: "markdown"
            content: "Die 24h-Werte sind gleitende Statistiken. Erst nach vollständiger Tagesaufzeichnung ist das Fenster voll abgedeckt."
  - title: "Heiztakte"
    path: "heiztakte"
    icon: "mdi:chart-timeline-variant"
    type: "sections"
    max_columns: 3
    sections:
      - type: "grid"
