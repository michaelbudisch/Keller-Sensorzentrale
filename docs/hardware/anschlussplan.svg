<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="1060" version="1.1" viewBox="0 0 1420 1060" width="1420" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#fafbfd" height="1060" width="1420" x="0" y="0" /><text fill="#142c43" font-family="DejaVu Sans,Arial,sans-serif" font-size="37" font-weight="bold" x="50" y="66">KELLER SENSORZENTRALE</text><text fill="#596979" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" x="50" y="100">ELEKTRISCHE ANSCHLUESSE · Wemos D1 mini (ESP8266) · keine JST-Pinreihenfolge</text><rect fill="#ffffff" height="545" rx="12" ry="12" stroke="#c6d4e0" stroke-width="2" width="1320" x="45" y="127" /><text fill="#142c43" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="bold" x="69" y="164">6 × 3-Pin-Temperatur-Slots: drei getrennte 1-Wire-Busse</text><text fill="#142c43" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" x="69" y="197">Jeder Stecker: 3V3 / DATA / GND. Je ein Pull-up-Widerstand nach 3V3 pro Bus.</text><rect fill="#e2effc" height="53" rx="12" ry="12" stroke="#1666a8" stroke-width="2" width="170" x="66" y="237" /><text fill="#142c43" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="bold" text-anchor="middle" x="151" y="272">D1 / GPIO5</text><line stroke="#b67b08" stroke-linecap="round" stroke-width="5" x1="237" x2="886" y1="265" y2="265" /><circle cx="575" cy="265" fill="#b67b08" r="6" /><circle cx="886" cy="265" fill="#b67b08" r="6" /><line stroke="#ca3843" stroke-linecap="round" stroke-width="4" x1="575" x2="575" y1="265" y2="221" /><rect fill="#f2d19e" height="34" stroke="#a57a2f" stroke-width="2" width="30" x="560" y="187" /><line stroke="#ca3843" stroke-linecap="round" stroke-width="4" x1="575" x2="575" y1="187" y2="174" /><text fill="#142c43" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" x="600" y="200">5 kΩ</text><text fill="#ca3843" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="575" y="164">3V3</text><rect fill="#fffaf0" height="50" rx="12" ry="12" stroke="#dcbd78" stroke-width="2" width="168" x="908" y="214" /><text fill="#142c43" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="992" y="245">Slot 1</text><line stroke="#b67b08" stroke-linecap="round" stroke-width="4" x1="886" x2="886" y1="265" y2="238" /><line stroke="#b67b08" stroke-linecap="round" stroke-width="4" x1="886" x2="908" y1="238" y2="238" /><rect fill="#fffaf0" height="50" rx="12" ry="12" stroke="#dcbd78" stroke-width="2" width="168" x="908" y="268" /><text fill="#142c43" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="992" y="299">Slot 2</text><line stroke="#b67b08" stroke-linecap="round" stroke-width="4" x1="886" x2="886" y1="265" y2="292" /><line stroke="#b67b08" stroke-linecap="round" stroke-width="4" x1="886" x2="908" y1="292" y2="292" /><text fill="#b67b08" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" x="1100" y="273">DATA</text><rect fill="#e2effc" height="53" rx="12" ry="12" stroke="#1666a8" stroke-width="2" width="170" x="66" y="370" /><text fill="#142c43" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="bold" text-anchor="middle" x="151" y="405">D2 / GPIO4</text><line stroke="#b67b08" stroke-linecap="round" stroke-width="5" x1="237" x2="886" y1="398" y2="398" /><circle cx="575" cy="398" fill="#b67b08" r="6" /><circle cx="886" cy="398" fill="#b67b08" r="6" /><line stroke="#ca3843" stroke-linecap="round" stroke-width="4" x1="575" x2="575" y1="398" y2="354" /><rect fill="#f2d19e" height="34" stroke="#a57a2f" stroke-width="2" width="30" x="560" y="320" /><line stroke="#ca3843" stroke-linecap="round" stroke-width="4" x1="575" x2="575" y1="320" y2="307" /><text fill="#142c43" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" x="600" y="333">5 kΩ</text><text fill="#ca3843" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="575" y="297">3V3</text><rect fill="#fffaf0" height="50" rx="12" ry="12" stroke="#dcbd78" stroke-width="2" width="168" x="908" y="347" /><text fill="#142c43" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="992" y="378">Slot 3</text><line stroke="#b67b08" stroke-linecap="round" stroke-width="4" x1="886" x2="886" y1="398" y2="371" /><line stroke="#b67b08" stroke-linecap="round" stroke-width="4" x1="886" x2="908" y1="371" y2="371" /><rect fill="#fffaf0" height="50" rx="12" ry="12" stroke="#dcbd78" stroke-width="2" width="168" x="908" y="401" /><text fill="#142c43" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="992" y="432">Slot 4</text><line stroke="#b67b08" stroke-linecap="round" stroke-width="4" x1="886" x2="886" y1="398" y2="425" /><line stroke="#b67b08" stroke-linecap="round" stroke-width="4" x1="886" x2="908" y1="425" y2="425" /><text fill="#b67b08" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" x="1100" y="406">DATA</text><rect fill="#e2effc" height="53" rx="12" ry="12" stroke="#1666a8" stroke-width="2" width="170" x="66" y="503" /><text fill="#142c43" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="bold" text-anchor="middle" x="151" y="538">D5 / GPIO14</text><line stroke="#b67b08" stroke-linecap="round" stroke-width="5" x1="237" x2="886" y1="531" y2="531" /><circle cx="575" cy="531" fill="#b67b08" r="6" /><circle cx="886" cy="531" fill="#b67b08" r="6" /><line stroke="#ca3843" stroke-linecap="round" stroke-width="4" x1="575" x2="575" y1="531" y2="487" /><rect fill="#f2d19e" height="34" stroke="#a57a2f" stroke-width="2" width="30" x="560" y="453" /><line stroke="#ca3843" stroke-linecap="round" stroke-width="4" x1="575" x2="575" y1="453" y2="440" /><text fill="#142c43" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" x="600" y="466">5 kΩ</text><text fill="#ca3843" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="575" y="430">3V3</text><rect fill="#fffaf0" height="50" rx="12" ry="12" stroke="#dcbd78" stroke-width="2" width="168" x="908" y="480" /><text fill="#142c43" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="992" y="511">Slot 5</text><line stroke="#b67b08" stroke-linecap="round" stroke-width="4" x1="886" x2="886" y1="531" y2="504" /><line stroke="#b67b08" stroke-linecap="round" stroke-width="4" x1="886" x2="908" y1="504" y2="504" /><rect fill="#fffaf0" height="50" rx="12" ry="12" stroke="#dcbd78" stroke-width="2" width="168" x="908" y="534" /><text fill="#142c43" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="992" y="565">Slot 6</text><line stroke="#b67b08" stroke-linecap="round" stroke-width="4" x1="886" x2="886" y1="531" y2="558" /><line stroke="#b67b08" stroke-linecap="round" stroke-width="4" x1="886" x2="908" y1="558" y2="558" /><text fill="#b67b08" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" x="1100" y="539">DATA</text><text fill="#142c43" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" x="69" y="639">Alle sechs VCC-Kontakte → Wemos 3V3; alle sechs GND-Kontakte → Wemos GND.</text><rect fill="#ffffff" height="306" rx="12" ry="12" stroke="#c6d4e0" stroke-width="2" width="645" x="45" y="699" /><text fill="#142c43" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="bold" x="69" y="738">4-Pin Tankgeber (Autopuls-Modus)</text><text fill="#142c43" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" x="68" y="779">5V → Modul VCC     GND → gemeinsames GND</text><text fill="#142c43" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="bold" x="69" y="832">TX/ECHO</text><line stroke="#b67b08" stroke-linecap="round" stroke-width="4" x1="167" x2="215" y1="823" y2="823" /><rect fill="#f2d19e" height="23" stroke="#a57a2f" stroke-width="2" width="70" x="215" y="812" /><text fill="#142c43" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="middle" x="250" y="808">5 kΩ</text><line stroke="#b67b08" stroke-linecap="round" stroke-width="4" x1="285" x2="512" y1="823" y2="823" /><text fill="#1666a8" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="bold" x="543" y="831">D6</text><circle cx="427" cy="823" fill="#b67b08" r="6" /><line stroke="#596979" stroke-linecap="round" stroke-width="4" x1="427" x2="427" y1="823" y2="866" /><rect fill="#f2d19e" height="55" stroke="#a57a2f" stroke-width="2" width="24" x="415" y="866" /><text fill="#142c43" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal" x="451" y="897">6,8 kΩ</text><line stroke="#596979" stroke-linecap="round" stroke-width="4" x1="427" x2="427" y1="921" y2="945" /><text fill="#596979" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="427" y="971">GND</text><text fill="#ca3843" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" x="68" y="991">RX/TRIG bleibt frei; 5 V nie direkt auf D6.</text><rect fill="#ffffff" height="306" rx="12" ry="12" stroke="#c6d4e0" stroke-width="2" width="650" x="715" y="699" /><text fill="#142c43" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="bold" x="739" y="738">4-Pin Relais (nur Kleinspannungs-Test)</text><text fill="#ca3843" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" x="740" y="789">VCC</text><line stroke="#ca3843" stroke-linecap="round" stroke-width="4" x1="840" x2="990" y1="780" y2="780" /><text fill="#142c43" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" x="1014" y="789">5V*</text><text fill="#596979" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" x="740" y="829">GND</text><line stroke="#596979" stroke-linecap="round" stroke-width="4" x1="840" x2="990" y1="820" y2="820" /><text fill="#142c43" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" x="1014" y="829">Wemos GND</text><text fill="#b67b08" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" x="740" y="869">IN1</text><line stroke="#b67b08" stroke-linecap="round" stroke-width="4" x1="840" x2="990" y1="860" y2="860" /><text fill="#142c43" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" x="1014" y="869">D7 / GPIO13</text><text fill="#b67b08" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" x="740" y="909">IN2</text><line stroke="#b67b08" stroke-linecap="round" stroke-width="4" x1="840" x2="990" y1="900" y2="900" /><text fill="#142c43" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" x="1014" y="909">D0 / GPIO16</text><text fill="#142c43" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" x="740" y="959">* Nur bei passendem 5-V-Relaismodul; 3,3-V-Steuereingang pruefen.</text><text fill="#596979" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" x="47" y="1040">Schema: elektrische Netze, keine Pinpositionen am Gehaeuse-Stecker. Vor Inbetriebnahme messen.</text></svg>